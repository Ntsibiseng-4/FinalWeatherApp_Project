<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Share+Tech&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Weather App</title>
</head>
<body>
  <div class="weather-box">
    <header>
        <form class="search-form" id="search-form">
            <input type="search" placeholder="Enter a City.." class="search-input"id="search-form-input" required />
            <input type="submit" value="Search" class="search-button">
        </form>
    </header>
        <main>
            <div class="weather-data">
            <div>
         <h1 class="weather-city" id="weather-city"> Polokwane</h1>  
            <p class="weather-details">
                Tuesday 14:49, scattered clouds
                <br />
                Humidity: <strong>66%</strong>, Wind: <strong>3.13km/h</strong> 
            </p> 
            </div>
            <div class="weather-temperature-container">
                <div class="weather-icon">🌤️</div> 
                <div class="weather-temp">12</div> 
                <div class="weather-unit">°C</div>
            </div>
            </div>
        </main>
    
    <footer>
        This project was coded by
        <a href="https://github.com/Ntsibiseng-4" target="_blank">Ntsibiseng</a>,
        is<a href="https://github.com/Ntsibiseng-4/FinalWeatherApp_Project" target="_blank"> Open-Source GitHub</a>
    and website hosted <a href="https://weatherapp-byntsibiseng.netlify.app/" target="_blank">on Netlify</a>
    </footer>
  </div>
<script src="src/app.js"></script>
</body>
</html>
